name: Android layout QA
run-name: Layout QA ${{ inputs.release_tag }} ${{ inputs.package }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Public release tag to download the APK from
        required: true
        type: string
      package:
        description: Which APK to test
        required: true
        type: choice
        default: mobile
        options:
          - mobile
          - tv-stable
      observe_only:
        description: Record findings but never fail the job
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  phone-layout-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download exact public release APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          mkdir -p apk
          case "$PACKAGE" in
            mobile) pattern='Moonfin_Books_Android_mobile_signed.apk' ;;
            tv-stable) pattern='Moonfin_Books_AndroidTV_stable_signed.apk' ;;
            *) echo "unknown package choice: $PACKAGE" >&2; exit 1 ;;
          esac
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$pattern" \
            --dir apk
          test -s "apk/$pattern"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir apk
          (cd apk && grep -F "  $pattern" SHA256SUMS | sha256sum --check)
          ls -la apk

      - name: Enable KVM on the disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run phone layout QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 2048
          script: python3 scripts/android-layout-qa.py --package-choice '${{ inputs.package }}' ${{ inputs.observe_only && '--observe-only' || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-layout-qa-${{ inputs.release_tag }}-${{ inputs.package }}-evidence
          path: qa-evidence/*
          if-no-files-found: warn
          retention-days: 14
